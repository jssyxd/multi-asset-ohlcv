[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-crypto-datacatalog"
version = "1.0.0"
description = "Institutional-grade Crypto Market Data Pipeline & ParquetDataCatalog for NautilusTrader"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jssyxd"}
]
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
nautilus = [
    "nautilus_trader>=1.200.0"
]
dev = [
    "pytest>=7.0.0"
]
